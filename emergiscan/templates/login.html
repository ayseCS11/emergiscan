{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmergiScan - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(180deg, #0b1e33, #14304f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }
        .login-card {
            background: rgba(20, 40, 65, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            color: #fff;
        }
        .login-card input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 12px 16px;
            border-radius: 30px;
            width: 100%;
            margin-bottom: 16px;
        }
        .login-card input::placeholder { color: rgba(255,255,255,0.6); }
        .btn-signin {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 30px;
            width: 100%;
            font-weight: 600;
        }
        .badge-pill {
            background: rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 6px 16px;
            display: inline-block;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="fw-bold mb-1">🌤️ EmergiScan</h3>
        <div class="badge-pill">🏥 Seconds Should'nt Cost a life</div>

        <h2 class="fw-bold">Welcome back</h2>
        <p class="text-white-50 mb-4">Sign in to manage your healthcare dashboard</p>

        {% if form.errors %}
            <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username or Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-signin">Sign In →</button>
        </form>

        <div class="text-center text-white-50 mt-4" style="font-size: 13px;">
            Founded by M.Hassan Ilyas<br>
            mhassanilyas12@icloud.com
        </div>
    </div>
</body>
</html>
