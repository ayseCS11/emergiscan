<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enter Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0b1e33; min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:30px; border-radius:12px; max-width:400px; width:100%;">
        <h5>Enter Verification Code</h5>
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="otp_code" class="form-control mb-3" maxlength="6" placeholder="6-digit code" required>
            <button type="submit" class="btn btn-dark w-100">Verify</button>
        </form>
    </div>
</body>
</html>
