<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify Transfer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0b1e33; min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:30px; border-radius:12px; max-width:400px; width:100%;">
        <h5>Verify Transfer — MR {{ transfer.patient.mr_number }}</h5>
        <p class="text-muted">Enter the verification PIN provided by the referring hospital.</p>
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="password" name="pin" class="form-control mb-3" maxlength="10" placeholder="Enter PIN" required autofocus>
            <button type="submit" class="btn btn-dark w-100">Unlock Record</button>
        </form>
    </div>
</body>
</html>
