{% extends 'base.html' %}
{% block content %}
<div class="main-page">
    <div class="content-box mb-4" style="background:#0b1e33; color:#fff;">
        <h4 class="mb-0">✏️ Edit User — {{ edit_user.username }}</h4>
    </div>
    <form method="post" enctype="multipart/form-data" class="content-box">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="Staff" {% if profile.role == 'Staff' %}selected{% endif %}>Staff</option>
                    <option value="Admin" {% if profile.role == 'Admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="col-md-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ edit_user.email }}"></div>
            <div class="col-md-3"><label class="form-label">Qualification</label><input type="text" name="qualification" class="form-control" value="{{ profile.qualification|default:'' }}"></div>
            <div class="col-md-3"><label class="form-label">Designation</label><input type="text" name="designation" class="form-control" value="{{ profile.designation|default:'' }}"></div>
            <div class="col-md-3"><label class="form-label">Contact No</label><input type="text" name="contact_no" class="form-control" value="{{ profile.contact_no|default:'' }}"></div>
            <div class="col-md-3"><label class="form-label">Department</label><input type="text" name="department" class="form-control" value="{{ profile.department|default:'' }}"></div>
            <div class="col-md-3"><label class="form-label">Profile Pic</label><input type="file" name="profile_pic" class="form-control"></div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
        <a href="{% url 'user_management' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
{% endblock %}
