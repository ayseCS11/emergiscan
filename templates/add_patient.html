{% extends 'base.html' %}
{% block title %}Add Patient{% endblock %}
{% block content %}
<div class="main-page">
    <div class="content-box mb-4" style="background:#0b1e33; color:#fff;">
        <h4 class="mb-0">➕ Add Patient</h4>
        <small class="text-white-50">Quick registration — identification details only</small>
    </div>

    <form method="post" class="content-box">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">MR Number</label>
                <input type="text" class="form-control" value="{{ mr_number_preview }}" readonly>
                <small class="text-muted">Auto-assigned on save</small>
            </div>
            <div class="col-md-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">CNIC</label>
                <input type="text" name="cnic" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Blood Group</label>
                <select name="blood_group" class="form-select">
                    <option value="">Unknown</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Pregnancy Status</label>
                <select name="pregnancy_status" class="form-select">
                    <option>Not Pregnant</option>
                    <option>Pregnant</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-dark mt-4">💾 Save Patient</button>
        <a href="{% url 'emergency_entry' %}" class="btn btn-success mt-4">➡️ Save & Go to Emergency</a>
    </form>
</div>
{% endblock %}
