<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Transfer Receipt</title>
    <style>
        body { font-family: "Segoe UI", sans-serif; color: #1a202c; padding: 20px; text-align:center; }
        .mr-highlight h1 { font-size: 36px; color: #003060; margin: 10px 0 30px; }
        .qr-row { display:flex; justify-content:center; gap:40px; margin: 20px 0; flex-wrap: wrap; }
        .qr-box { text-align:center; }
        .qr-box img { width: 180px; height: 180px; }
        .qr-label { font-weight:bold; margin-top:8px; }
        .qr-sub { font-size:12px; color:#64748b; max-width:180px; margin:4px auto 0; }
        .footer { margin-top: 40px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="mr-highlight">
        <small>MR NUMBER</small>
        <h1>{{ transfer.patient.mr_number }}</h1>
    </div>

    <div class="qr-row">
        <div class="qr-box">
            <img src="data:image/png;base64,{{ qr_code }}">
            <div class="qr-label">🌐 Online QR</div>
          <div class="qr-sub">Scan, enter PIN, view full record</div>
        </div>
        <div class="qr-box">
            <img src="data:image/png;base64,{{ offline_qr_code }}">
            <div class="qr-label">📴 Offline QR</div>
            <div class="qr-sub">Works with zero internet</div>
        </div>
    </div>

    <div class="footer">Developed by Tekno Efsun SMC Pvt. Ltd.</div>
</body>
</html>
